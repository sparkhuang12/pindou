[project]
name = "pindou-pattern"
version = "0.1.0"
description = "Convert an input image into a labeled pin-bead color pattern."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "Pillow",
  "scipy",
  "scikit-image",
  "opencv-python-headless",
]

[project.scripts]
pindou = "pindou.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

