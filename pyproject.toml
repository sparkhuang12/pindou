[project]
name = "pindou-pattern"
version = "0.5.0"
description = "Web workspace and CLI for turning images into labeled pin-bead patterns."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.3",
  "Pillow>=10,<12",
  "scipy>=1.10,<1.16",
  "scikit-image>=0.21,<0.26",
  "opencv-python-headless>=4.8,<4.12",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
]

[project.scripts]
pindou = "pindou.cli:main"
pindou-web = "backend.main:main"
pindou-api = "backend.main:main"
pindou-worker = "backend.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pindou*", "backend*"]
